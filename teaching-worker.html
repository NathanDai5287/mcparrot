<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local teaching connection · MCParrot</title>
<style>body{font:17px system-ui;margin:40px;line-height:1.6;background:#f4f7f6;color:#253d36}h1{font-size:25px}button{padding:12px 20px;border:1px solid #32695e;border-radius:8px;background:white;font:inherit}#status{padding:16px;background:white;border-radius:12px}</style>
<h1>Connect this teaching browser</h1>
<p>Allow MCParrot to record reading requests while you browse the website.</p>
<p>Your school session and page content stay on this computer.</p>
<button id="allow">Connect to MCParrot</button>
<p id="status" role="status">Keep this window open during teaching.</p>
<script>
const dashboardOrigin = __DASHBOARD_ORIGIN__;
const localToken = __LOCAL_TOKEN__;
const allowedOperations = new Set(['get_teaching_status','start_recording','stop_recording','review_recording','test_saved_request','test_mcp_tool','focus_teaching_browser']);
let authorized = false;
let expiresAt = 0;
const openerWindow = window.opener;
document.querySelector('#allow').onclick = () => {
 if (!openerWindow) { document.querySelector('#status').textContent = 'Open this connection from the MCParrot teaching screen.'; return; }
 authorized = true;
 expiresAt = Date.now() + 3600000;
 document.querySelector('#allow').disabled = true;
 document.querySelector('#status').textContent = 'Connected for one hour. Return to MCParrot to start recording.';
 openerWindow.postMessage({type:'mcparrot-teaching-ready'}, dashboardOrigin);
};
window.addEventListener('message', async (event) => {
 if (!authorized || Date.now() > expiresAt || event.origin !== dashboardOrigin || event.source !== openerWindow) return;
 const message = event.data;
 if (message?.type !== 'mcparrot-teaching-command' || typeof message.id !== 'string' || !allowedOperations.has(message.name)) return;
 try {
  const response = await fetch('/operation', {method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${localToken}`},body:JSON.stringify({name:message.name,arguments:message.arguments})});
  const result = await response.json();
  openerWindow.postMessage({type:'mcparrot-teaching-result',id:message.id,result},dashboardOrigin);
 } catch {
  openerWindow.postMessage({type:'mcparrot-teaching-result',id:message.id,result:{error:'The local teaching connection failed.'}},dashboardOrigin);
 }
});
</script>
</html>
